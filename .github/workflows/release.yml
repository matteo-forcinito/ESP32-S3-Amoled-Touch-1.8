# Release: push a branch named release/X.Y.Z (stable channel) or
# release/X.Y.Z-dev.N (dev channel: test builds) and this workflow
#   1. builds the firmware with version X.Y.Z (FW_VERSION -> PROJECT_VER), with
#      ESP-IDF v6.1 installed on the runner and cached (no Docker Hub pulls:
#      their anonymous rate limit made releases fail)
#   2. publishes it as release "amoled-vX.Y.Z" in the PUBLIC binaries-only repo
#   3. adds it to amoled.json there (tools/update_catalog.py): the catalog of every
#      release and the newest of each channel, read by the watches
#   4. tags this (private) repo with amoled-vX.Y.Z
#
# Secrets (Settings > Secrets and variables > Actions):
#   REPOS_TOKEN     fine-grained token, Contents: read on watch-os-common (the submodule);
#                   used only to fetch the submodule
#   RELEASES_TOKEN  fine-grained token, Contents: read and write on watch-firmware-releases
#
# Pushing the same branch again republishes the same version (fixes before
# anyone updated). Watches only offer a HIGHER version on their channel (any
# version can still be picked by hand in Settings > Aggiornamento > Tutte le
# versioni): for a new release use a new branch, e.g. release/1.2.1.

name: Release

on:
  push:
    branches: ["release/**"]

concurrency:
  group: release-amoled
  cancel-in-progress: false

permissions:
  contents: write   # the tag in this repo

env:
  PRODUCT: amoled
  PRODUCT_NAME: AMOLED Watch (Waveshare ESP32-S3-Touch-AMOLED-1.8)
  APP_BIN: amoled_watch.bin
  RELEASES_REPO: matteo-forcinito/watch-firmware-releases
  RELEASE_BIN: firmware.bin   # same asset name for every product (the tag tells which)

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Version from the branch name
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The branch must be release/X.Y.Z or release/X.Y.Z-dev.N (got $GITHUB_REF_NAME)"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then channel=dev; else channel=stable; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=${PRODUCT}-v$version" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Submodule watch-os-common (private, read-only token)
        shell: bash
        env:
          REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          auth="url.https://x-access-token:${REPOS_TOKEN}@github.com/.insteadOf=https://github.com/"
          git -c "$auth" submodule update --init watch-os-common   # only this one: other gitlinks may have no URL

      - name: ESP-IDF v6.1 (cached between runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-v6.1-esp32s3-${{ runner.os }}

      - name: Install ESP-IDF if not cached
        shell: bash
        run: |
          if [ ! -f "$HOME/esp-idf/export.sh" ]; then
            git clone --depth 1 --branch v6.1 --recursive --shallow-submodules \
              https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          fi
          "$HOME/esp-idf/install.sh" esp32s3

      - name: Build
        shell: bash
        env:
          FW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          . "$HOME/esp-idf/export.sh"
          rm -f sdkconfig                      # always from sdkconfig.defaults
          idf.py set-target esp32s3
          idf.py build
          # The version really inside the image (what the watch compares).
          python - <<'EOF'
          import json, os
          desc = json.load(open("build/project_description.json"))
          assert desc["project_version"] == os.environ["FW_VERSION"], desc["project_version"]
          print("version in the image:", desc["project_version"])
          EOF

      - name: Build and package Remote
        shell: bash
        run: |
          . "$HOME/esp-idf/export.sh"
          idf.py -C external_apps/remote -B external_apps/remote/build-release set-target esp32s3
          idf.py -C external_apps/remote -B external_apps/remote/build-release build
          mkdir -p dist/remote/apps/Remote
          cp external_apps/remote/build-release/remote.bin dist/remote/apps/Remote/Remote.bin
          cp external_apps/remote/manifest.json external_apps/remote/icon.png dist/remote/apps/Remote/
          python3 -c "import shutil; shutil.make_archive('dist/remote-${PRODUCT}-1.0.1', 'zip', 'dist/remote')"

      - name: Build and package ORBIT
        shell: bash
        run: |
          . "$HOME/esp-idf/export.sh"
          idf.py -C external_apps/orbit -B external_apps/orbit/build-release set-target esp32s3
          idf.py -C external_apps/orbit -B external_apps/orbit/build-release build
          mkdir -p dist/orbit/apps/Orbit
          cp external_apps/orbit/build-release/orbit.bin dist/orbit/apps/Orbit/Orbit.bin
          cp external_apps/orbit/manifest.json external_apps/orbit/icon.png dist/orbit/apps/Orbit/
          python3 -c "import shutil; shutil.make_archive('dist/orbit-${PRODUCT}-1.0.0', 'zip', 'dist/orbit')"

      - name: Build and package WebRadio
        shell: bash
        run: |
          . "$HOME/esp-idf/export.sh"
          idf.py -C external_apps/webradio -B external_apps/webradio/build-release set-target esp32s3
          idf.py -C external_apps/webradio -B external_apps/webradio/build-release build
          mkdir -p dist/webradio/apps/WebRadio
          cp external_apps/webradio/build-release/webradio.bin dist/webradio/apps/WebRadio/WebRadio.bin
          cp external_apps/webradio/manifest.json external_apps/webradio/icon.png dist/webradio/apps/WebRadio/
          python3 -c "import shutil; shutil.make_archive('dist/webradio-${PRODUCT}-1.0.0', 'zip', 'dist/webradio')"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/usb-flash/bootloader dist/usb-flash/partition_table
          cp "build/$APP_BIN" "dist/$RELEASE_BIN"
          # USB recovery: the separate images + their addresses (flash_args keeps the
          # build's folder layout). Never a merged image: its padding would erase
          # the nvsfactory partition of the Watcher (device identity).
          cp build/bootloader/bootloader.bin dist/usb-flash/bootloader/
          cp build/partition_table/partition-table.bin dist/usb-flash/partition_table/
          cp build/ota_data_initial.bin "build/$APP_BIN" build/flash_args dist/usb-flash/
          python3 -c "import shutil; shutil.make_archive('dist/${PRODUCT}-usb-flash-${{ steps.version.outputs.version }}', 'zip', 'dist', 'usb-flash')"
          sha256sum "dist/$RELEASE_BIN" "dist/remote-${PRODUCT}-1.0.1.zip" "dist/orbit-${PRODUCT}-1.0.0.zip" "dist/webradio-${PRODUCT}-1.0.0.zip" | tee dist/SHA256SUMS.txt

      - name: Publish the release (public repo)
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ${{ env.PRODUCT_NAME }} ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.channel == 'dev' }}
          make_latest: ${{ steps.version.outputs.channel == 'stable' }}
          body: |
            Firmware ${{ env.PRODUCT_NAME }} ${{ steps.version.outputs.version }} (channel: ${{ steps.version.outputs.channel }}).

            - ECOS: direct ESP-NOW pairing without a router, with matching codes and confirmation on both devices. Explicit LAN pairing is also available.
            - Family on the watch and main dashboard: paired devices, status, Find/ring and stop, quick messages, and local removal of a pairing.
            - Authenticated encrypted EL02 transport, persistent command replay protection, bounded Find ringtone, and priority for real alarms.
            - Update BOTH devices to this release for Family communication. Existing pairing credentials remain valid; no NVS reset is needed. Forgetting is local, not distributed revocation.
            - All four board firmware builds and C protocol/codec tests passed. Final Family EL02 hardware qualification, power-cycle/fault testing and minimum runtime heap measurements remain pending.
            - Family listens while its interface is active, during the dashboard lease, or under the external-power/screen-off policy; listening consumes radio power and RAM.
            - Online update: Settings > Aggiornamento. From a PC, upload firmware.bin through the watch dashboard.
            - USB: unzip the board-specific usb-flash package and use its flash_args. Keep device NVS and identity partitions.
          files: |
            dist/${{ env.RELEASE_BIN }}
            dist/${{ env.PRODUCT }}-usb-flash-${{ steps.version.outputs.version }}.zip
            dist/remote-${{ env.PRODUCT }}-1.0.1.zip
            dist/orbit-${{ env.PRODUCT }}-1.0.0.zip
            dist/webradio-${{ env.PRODUCT }}-1.0.0.zip
            dist/SHA256SUMS.txt

      - name: Add it to the catalog the watches read
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="$(git log -1 --format=%s)"
          git clone --depth 1 "https://x-access-token:${RELEASES_TOKEN}@github.com/${RELEASES_REPO}.git" public
          python3 tools/update_catalog.py "public/${PRODUCT}.json" \
            --version "$VERSION" \
            --url "https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${RELEASE_BIN}" \
            --size "$(stat -c %s "dist/$RELEASE_BIN")" \
            --sha256 "$(sha256sum "dist/$RELEASE_BIN" | cut -d' ' -f1)" \
            --notes "$notes"
          cd public
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add "${PRODUCT}.json"
          git diff --cached --quiet && { echo "catalog unchanged"; exit 0; }
          git commit -m "${PRODUCT} ${VERSION}"
          # Several products may release at once: if another one pushed its
          # catalog meanwhile, put ours on top (each touches only its own file).
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase
          done
          exit 1

      - name: Tag this repo
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
